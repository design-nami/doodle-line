<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Doodle Line</title>

    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Doodle Line" />
    <style>
      :root {
        --accent: #80ff80;
        --bg: #fff;
        --cell: 80px;
        --rail-width: 240px;
        --title-height: 112px;
        --title-inset: 16px;
        --download-height: 48px;
        --tools-gap: 32px;
        --utility-size: 64px;
        --utility-gap: 16px;
        --icon-size: 70px;
        --tg1: 16px;
        --tg2: 16px;
        --tg3: 16px;
        --tg4: 16px;
        --tg5: 16px;
        --tg6: 16px;
        --tg7: 16px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Noto Sans JP",
          sans-serif;
      }
      #wrap {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      canvas.overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      #thumbbar {
        position: fixed;
        top: 0;
        right: 0;
        width: var(--rail-width);
        z-index: 905;
      }
      #layout-title {
        height: var(--title-height);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        box-sizing: border-box;
        background: white;
        border-left: 1px solid black;
        border-right: 1px solid black;
        padding-top: 1px;
      }
      #layout-title .pill {
        flex: none;
        align-self: flex-start;
        margin: calc(var(--title-inset) - 1px) 0 0
          calc(var(--title-inset) - 1px);
        font:
          400 24px/32px system-ui,
          sans-serif;
        transform: translateY(-4px);
      }
      #tagline {
        flex: none;
        align-self: flex-start;
        margin: 0 0 0 calc(var(--title-inset) - 1px);
        height: 24px;
        font-size: 16px;
        font-weight: 400;
        line-height: 24px;
        letter-spacing: 0;
        white-space: nowrap;
        color: #000;
      }
      #tagline span {
        display: inline-block;
      }
      #tagline .t1 {
        font-size: var(--tg1);
      }
      #tagline .t2 {
        font-size: var(--tg2);
      }
      #tagline .t3 {
        font-size: var(--tg3);
      }
      #tagline .t4 {
        font-size: var(--tg4);
      }
      #tagline .t5 {
        font-size: var(--tg5);
      }
      #tagline .t6 {
        font-size: var(--tg6);
      }
      #tagline .t7 {
        font-size: var(--tg7);
      }
      #thumbgrid {
        display: grid;
        grid-template-columns: repeat(3, var(--cell));
        grid-auto-rows: var(--cell);
        gap: 0;
        width: var(--rail-width);
      }
      .thumb {
        position: relative;
        box-sizing: border-box;
        width: var(--cell);
        height: var(--cell);
        border: solid black;
        border-width: 1px 0 0 1px;
        border-radius: 0;
        outline: none;
        box-shadow: none;
        overflow: hidden;
        cursor: pointer;
        background: #fff no-repeat center / var(--icon-size) var(--icon-size);
        background-origin: border-box;
      }
      .thumb:nth-child(3n) {
        border-right-width: 1px;
      }
      .thumb:nth-last-child(-n + 3) {
        border-bottom-width: 1px;
      }
      .thumb.active {
        overflow: visible;
        z-index: 1;
      }
      .thumb.active::before {
        content: "";
        position: absolute;
        left: -1px;
        top: -1px;
        width: var(--cell);
        height: var(--cell);
        box-sizing: border-box;
        border: 3px solid var(--accent);
        border-radius: 50%;
        pointer-events: none;
      }
      #utilitygrid {
        position: fixed;
        z-index: 1002;
        top: calc(
          var(--title-height) + var(--cell) +
            (var(--cell) - var(--utility-size)) / 2
        );
        right: calc(var(--rail-width) + var(--tools-gap));
        width: var(--utility-size);
        display: grid;
        grid-template-columns: var(--utility-size);
        grid-auto-rows: var(--utility-size);
        gap: var(--utility-gap);
      }
      .sidebtn {
        position: relative;
        box-sizing: border-box;
        width: var(--utility-size);
        height: var(--utility-size);
        margin: 0;
        padding: 0;
        border: 1px solid black;
        border-radius: 50%;
        box-shadow: none;
        background: #fff;
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .sidebtn span {
        display: inline-block;
        text-align: center;
        font:
          400 12px/16px system-ui,
          sans-serif;
      }
      .sidebtn[disabled] {
        opacity: 0.4;
      }
      #eraserBtn.active,
      #eraserBtn[aria-pressed="true"] {
        background: #c0ffff;
        -webkit-text-fill-color: #000;
      }
      #saveLink {
        width: 100%;
        height: var(--download-height);
        box-sizing: border-box;
        padding: 0 calc(var(--title-inset) - 1px);
        margin: 0;
        border: 1px solid black;
        border-top: 0;
        border-radius: 0;
        background: white;
        color: #000;
        box-shadow: none;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        text-align: left;
        font:
          400 14px / normal "Yu Gothic UI",
          "Yu Gothic",
          Meiryo,
          sans-serif;
        text-decoration: none;
        cursor: pointer;
        z-index: 1002;
      }
      #microfoot {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 1001;
        font-size: 12px;
        letter-spacing: 0.02em;
        text-align: left;
        color: #000;
        pointer-events: none;
      }
    </style>

    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <canvas id="ov" class="overlay" aria-hidden="true"></canvas>

      <div class="thumbbar" id="thumbbar">
        <div id="layout-title">
          <div class="pill">Doodle Line</div>
          <div class="tagline" id="tagline" aria-label="かいてあそぼう">
            <span>か</span><span>い</span><span>て</span><span>あ</span
            ><span>そ</span><span>ぼ</span><span>う</span>
          </div>
        </div>
        <div class="thumbgrid" id="thumbgrid"></div>
        <button class="save-link" id="saveLink" type="button">
          らくがきをダウンロード
        </button>
      </div>

      <div class="utilitygrid" id="utilitygrid" aria-label="編集ツール">
        <button class="sidebtn eraser" id="eraserBtn" type="button">
          <span>Erase<br />けす</span>
        </button>
        <button class="sidebtn back" id="backBtn" type="button">
          <span>Back<br />もどる</span>
        </button>
        <button class="sidebtn clear" id="clearBtn" type="button">
          <span>Clear<br />クリア</span>
        </button>
      </div>
    </div>
    <footer class="microfoot" id="microfoot">
      © Doodle Line — Code as Touch by nami
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        "use strict";

        const seatOrder = [
          "A1",
          "A2",
          "A3",
          "B4",
          "B5",
          "B6",
          "C7",
          "C8",
          "C9",
          "D10",
          "D11",
          "D12",
          "E13",
          "E14",
          "E15",
          "F16",
          "F17",
          "F18",
          "G19",
          "G20",
          "G21",
          "H22",
          "H23",
          "H24",
        ];
        const FIXED_SEAT_TO_BRUSH = {
          A1: "brush.line_fine",
          A2: "brush.line_bit",
          A3: "brush.geometric_dash",
          B4: "brush.connect_past",
          B5: "brush.snap_close",
          B6: "brush.fill_gray",
          C7: "brush.debris_chips",
          C8: "brush.debris_dash",
          C9: "brush.stardust",
          D10: "brush.seg_wander",
          D11: "brush.nib_flat",
          D12: "brush.hatch_slash",
          E13: "brush.tube_rim",
          E14: "brush.tube_neon@E14",
          E15: "brush.tube_spine",
          F16: "brush.dots_mono",
          F17: "brush.ring_var",
          F18: "brush.ring_unite",
          G19: "brush.confetti",
          G20: "brush.sprinkle_cross",
          G21: "brush.sprinkle_oval",
          H22: "brush.connected_squares",
          H23: "brush.geometric_outline",
          H24: "brush.wave",
        };

        const BRUSH_LABELS = {
          A1: "細い線",
          A2: "角ばった線",
          A3: "幾何学の破線",
          B4: "折れ線",
          B5: "閉じる線",
          B6: "グレーの面",
          C7: "図形のかけら",
          C8: "短い線の散布",
          C9: "星くず",
          D10: "長い線の散布",
          D11: "平たい線",
          D12: "斜線",
          E13: "縁取りの線",
          E14: "濃淡のある線",
          E15: "ぼかした線",
          F16: "黒い点",
          F17: "重なる円",
          F18: "つながる円",
          G19: "四角の散布",
          G20: "十字の散布",
          G21: "楕円の散布",
          H22: "つながる正方形",
          H23: "白塗りの幾何学線",
          H24: "ウェーブ",
        };

        function baseOf(id) {
          if (!id) return id;
          return id.replace(/@.*/, "");
        }

        const BRUSHES = (function () {
          const B = { width: { min: 1, max: 1 }, spacingPx: 1 };
          function p(o) {
            return JSON.parse(JSON.stringify(o));
          }
          return {
            "brush.geometric_dash": {
              params: { width: { min: 2, max: 2 }, geometric: "dash" },
            },
            "brush.connected_squares": {
              params: { width: { min: 8, max: 8 }, geometric: "squares" },
            },
            "brush.geometric_outline": {
              params: { width: { min: 8, max: 32 }, geometric: "outline" },
            },
            "brush.line_fine": {
              params: {
                ...p(B),
                width: { min: 0.5, max: 0.5 },
                spacingPx: 0.5,
              },
            },
            "brush.line_bit": {
              params: { ...p(B), width: { min: 2, max: 2 }, spacingPx: 1 },
            },
            "brush.connect_past": {
              params: {
                ...p(B),
                width: { min: 4, max: 4 },
                facets: 12,
                facetStep: 10,
              },
            },
            "brush.snap_close": {
              params: { ...p(B), width: { min: 1, max: 1 } },
            },
            "brush.fill_gray": {
              params: { ...p(B), width: { min: 28, max: 28 } },
            },
            "brush.debris_chips": {
              params: { ...p(B), width: { min: 1, max: 1 } },
            },
            "brush.debris_dash": {
              params: {
                ...p(B),
                width: { min: 40, max: 40 },
                sprinkles: { lenMin: 4, lenMax: 24 },
                spacingPx: 1,
              },
            },
            "brush.nib_flat": {
              params: { ...p(B), width: { min: 10, max: 10 } },
            },
            "brush.tube_neon@E14": {
              params: {
                ...p(B),
                width: { min: 24, max: 24 },
                band: { alphas: [0.15, 0.35, 0.6, 0.95] },
              },
            },
            "brush.tube_spine": {
              params: {
                ...p(B),
                width: { min: 28, max: 28 },
                band: { alphas: [0.5, 0.27, 0.24, 0.14] },
              },
            },
            "brush.dots_mono": {
              params: { ...p(B), width: { min: 10, max: 10 } },
            },
            "brush.ring_var": {
              params: {
                ...p(B),
                width: { min: 1, max: 1 },
                circlesVar: {
                  bBase: 12,
                  basePitch: 120,
                  speedGainPitch: 0.9,
                  speedCurve: 2.0,
                  speedCalib: 1.6,
                  strokeChoices: [1, 2, 3, 4],
                },
              },
            },
            "brush.ring_unite": {
              params: { ...p(B), width: { min: 1, max: 1 } },
            },
            "brush.stardust": {
              params: { ...p(B), width: { min: 40, max: 40 } },
            },
            "brush.tube_rim": {
              params: {
                ...p(B),
                width: { min: 24, max: 24 },
              },
            },
            "brush.confetti": {
              params: { ...p(B), width: { min: 1, max: 1 }, snow: { dot: 8 } },
            },

            "brush.hatch_slash": {
              params: {
                ...p(B),
                width: { min: 1, max: 1 },
                hatch: {
                  angle: Math.PI / 4,
                  Lmin: 6,
                  Lmax: 18,
                  Pmin: 8,
                  Pmax: 64,
                  offsetN: 6,
                  dynamicSpacing: true,
                },
              },
            },
            "brush.sprinkle_cross": {
              params: {
                ...p(B),
                width: { min: 1, max: 1 },
                cross: { size: 8, minGap: 12 },
              },
            },
            "brush.seg_wander": {
              params: {
                ...p(B),
                width: { min: 1, max: 1 },
                rseg: {
                  pitch: 40,
                  lenScale: 3.6,
                  fracMin: 0.5,
                  fracMax: 0.6667,
                  stepMul: 0.35,
                },
              },
            },
            "brush.sprinkle_oval": {
              params: {
                ...p(B),
                width: { min: 1, max: 1 },
                spacingPx: 14,
              },
            },
            "brush.wave": {
              params: {
                ...p(B),
                width: { min: 1.5, max: 1.5 },
                spacingPx: 5,
                wave: { amplitude: 16, frequency: 0.55 },
              },
            },
          };
        })();

        const cvs = document.getElementById("c");
        const ctx = cvs.getContext("2d");
        const ov = document.getElementById("ov");
        const ovctx = ov.getContext("2d");
        let dpr = Math.max(1, window.devicePixelRatio || 1);

        // Each renderer starts with the same canvas compositing and stroke settings.
        function resetStrokeState(g) {
          g.globalCompositeOperation = "source-over";
          try {
            g.setLineDash([]);
          } catch (e) {}
          g.lineJoin = "round";
          g.lineCap = "round";
          g.globalAlpha = 1;
        }
        function fillWhite() {
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          resetStrokeState(ctx);
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.restore();
        }
        function clearOverlay() {
          ovctx.save();
          ovctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          resetStrokeState(ovctx);
          ovctx.clearRect(0, 0, ov.width, ov.height);
          ovctx.restore();
        }

        const UNDO_MAX_BYTES = 96 * 1024 * 1024;
        const undoStack = [];
        let undoBytes = 0;
        function updateBackEnabled() {
          const b = document.getElementById("backBtn");
          if (b) b.disabled = undoStack.length === 0;
        }
        function _makeSnapshot() {
          try {
            const off = document.createElement("canvas");
            off.width = cvs.width;
            off.height = cvs.height;
            off._dpr = dpr;
            off._bytes = off.width * off.height * 4;
            const g = off.getContext("2d");
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.drawImage(cvs, 0, 0);
            return off;
          } catch (e) {
            return null;
          }
        }
        function pushSnapshot() {
          const s = _makeSnapshot();
          if (!s) return false;
          const bytes = s._bytes || 0;
          while (undoStack.length && undoBytes + bytes > UNDO_MAX_BYTES) {
            const old = undoStack.shift();
            undoBytes -= old._bytes || 0;
          }
          if (bytes > UNDO_MAX_BYTES) return false;
          undoStack.push(s);
          undoBytes += bytes;
          updateBackEnabled();
          return true;
        }
        function paintSnapshot(s) {
          if (!s) return;
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          resetStrokeState(ctx);
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          const k = dpr / (s._dpr || dpr);
          ctx.drawImage(
            s,
            0,
            0,
            s.width,
            s.height,
            0,
            0,
            s.width * k,
            s.height * k,
          );
          ctx.restore();
        }
        function restoreSnapshot() {
          if (!undoStack.length) return;
          const s = undoStack.pop();
          undoBytes -= s._bytes || 0;
          paintSnapshot(s);
          updateBackEnabled();
        }

        function resize() {
          const previous = cvs.width && cvs.height ? _makeSnapshot() : null;
          const cssW = Math.max(1, innerWidth),
            cssH = Math.max(1, innerHeight),
            MAX_PIXELS = 16 * 1024 * 1024;
          dpr = Math.max(
            1,
            Math.min(
              2,
              devicePixelRatio || 1,
              Math.sqrt(MAX_PIXELS / (cssW * cssH)),
            ),
          );
          cvs.style.width = cssW + "px";
          cvs.style.height = cssH + "px";
          cvs.width = Math.floor(cssW * dpr);
          cvs.height = Math.floor(cssH * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ov.style.width = cvs.style.width;
          ov.style.height = cvs.style.height;
          ov.width = cvs.width;
          ov.height = cvs.height;
          ovctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          clearOverlay();
          fillWhite();
          if (previous) paintSnapshot(previous);
          updateBackEnabled();
        }
        let resizeFrame = 0;
        addEventListener(
          "resize",
          () => {
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(resize);
          },
          { passive: true },
        );
        resize();

        let __eraserActive = false;
        let __eraserCursorUrl = null;
        function setEraserActive(v) {
          __eraserActive = !!v;
          var b = document.getElementById("eraserBtn");
          if (b) {
            if (b.classList) b.classList.toggle("active", __eraserActive);
            var on = __eraserActive;
            var want = on ? "true" : "false";
            if (b.getAttribute("aria-pressed") !== want)
              b.setAttribute("aria-pressed", want);
            var htmlLbl = on
              ? "<span>Doodle<br>かく</span>"
              : "<span>Erase<br>けす</span>";
            if (b.innerHTML !== htmlLbl) b.innerHTML = htmlLbl;
          }

          try {
            if (typeof cvs !== "undefined" && cvs && cvs.style) {
              if (__eraserActive) {
                {
                  __ensureEraserCursor();
                }
                if (__eraserCursorUrl) {
                  cvs.style.cursor =
                    "url(" + __eraserCursorUrl + ") 16 16, crosshair";
                } else {
                  cvs.style.cursor = "crosshair";
                }
              } else {
                cvs.style.cursor = "crosshair";
              }
            }
          } catch (_) {}
        }

        function __ensureEraserCursor() {
          try {
            if (__eraserCursorUrl) return;
            const sz = 32;
            const off = document.createElement("canvas");
            off.width = sz;
            off.height = sz;
            const g = off.getContext("2d");
            g.clearRect(0, 0, sz, sz);
            g.strokeStyle = "#000";
            g.lineWidth = 1;
            const cx = sz / 2,
              cy = sz / 2,
              R = 12;
            g.beginPath();
            g.arc(cx, cy, R, Math.PI, 0, false);
            g.stroke();
            __eraserCursorUrl = off.toDataURL("image/png");
          } catch (_) {}
        }
        function eraseSegment(a, b) {
          if (!a || !b) return;
          ctx.save();
          resetStrokeState(ctx);
          ctx.globalCompositeOperation = "source-over";
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          const W = 24;
          ctx.lineWidth = W;
          ctx.strokeStyle = "#fff";
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.restore();
        }

        let activeSeatIdx = 0;
        const seatToBrush = FIXED_SEAT_TO_BRUSH;

        function currentSeat() {
          return seatOrder[activeSeatIdx];
        }
        function currentBrushId() {
          const id = seatToBrush[currentSeat()];
          return id || "brush.empty";
        }
        function currentCfg() {
          const id = currentBrushId();
          return BRUSHES[id]?.params || null;
        }

        function ensureBrushState(cfg) {
          if (!cfg) return;
          if (!cfg._state)
            cfg._state = {
              bigDotsCenters: [],
              occSnow: new Map(),
              snowP: 0.48,
              bigDotsDist: 0,
              spraySide: 1,
            };
        }

        function setActiveSeat(seatIdx) {
          activeSeatIdx = seatIdx;
          const nodes = [...document.querySelectorAll(".thumb")];
          nodes.forEach(
            (n) => n && n.classList && n.classList.remove("active"),
          );
          const t = nodes[activeSeatIdx];
          if (t) t.classList.add("active");
          nodes.forEach((n, i) =>
            n.setAttribute("aria-pressed", String(i === activeSeatIdx)),
          );
          setEraserActive(false);
          resetStrokeState(ctx);
          clearOverlay();
        }

        const __thumbCache = new Map();
        function renderThumbForBrush(brushId) {
          const base = baseOf(brushId);
          if (base !== "brush.wave") return null;
          if (__thumbCache.has(base)) return __thumbCache.get(base);
          const W = 72,
            H = 72,
            off = document.createElement("canvas");
          off.width = W;
          off.height = H;
          const g = off.getContext("2d");
          g.fillStyle = "#fff";
          g.fillRect(0, 0, W, H);
          g.strokeStyle = "#000";
          g.fillStyle = "#000";
          g.lineWidth = 2;
          const iconScale = (W * 0.6) / 52;
          g.save();
          g.translate(W / 2, H / 2);
          g.scale(iconScale, iconScale);
          g.translate(-W / 2, -H / 2);
          g.beginPath();
          for (let x = 10; x <= 62; x += 2) {
            const phase = (x - 10) * 0.24;
            const amplitude = phase >= 3 * Math.PI ? 8 : 10;

            if (Math.random() < voidP) continue;
            const cx = a.x + tx * dist * t,
              cy = a.y + ty * dist * t;
            const Rstep = R0 * (0.9 + 0.2 * Math.random());
            const baseDrops = 4;
            let p = Math.min(0.32, 0.035 + 0.24 * edgeW);
            if (steps <= 2 || i === 1 || i === steps) p = Math.max(p, 0.22);

            for (let k = 0; k < baseDrops; k++) {
              if (Math.random() > p) continue;
              const rim = Math.random() < 0.6;
              const rr = rim
                ? Rstep * (0.88 + 0.16 * Math.random())
                : Rstep * Math.sqrt(Math.random());
              let th = Math.random() * Math.PI * 2;
              const d = Math.abs(
                Math.atan2(Math.sin(th - nAng), Math.cos(th - nAng)),
              );
              if (d > Math.PI / 2 && Math.random() < 0.6) continue;
              const x = cx + rr * Math.cos(th),
                y = cy + rr * Math.sin(th);
              const uL = Math.random();
              let L;
              if (uL < 0.7) {
                const v = Math.random();
                L = lenMin + (lenMax - lenMin) * Math.pow(v, 3.0);
              } else {
                const v = Math.random();
                const base = lenMin + 4;
                L = base + (lenMax - base) * Math.pow(v, 0.5);
              }
              const ang = Math.random() * Math.PI * 2;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(Math.round(x), Math.round(y));
              ctx.lineTo(
                Math.round(x + L * Math.cos(ang)),
                Math.round(y + L * Math.sin(ang)),
              );
              ctx.stroke();
              emitted++;
            }
          }

          if (emitted === 0) {
            const cx = (a.x + b.x) / 2,
              cy = (a.y + b.y) / 2;
            const L = Math.max(3, lenMin);
            const ang = Math.random() * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.round(cx), Math.round(cy));
            ctx.lineTo(
              Math.round(cx + L * Math.cos(ang)),
              Math.round(cy + L * Math.sin(ang)),
            );
            ctx.stroke();
            emitted = 1;
          }
          S.sprinkleEmit = (S.sprinkleEmit | 0) + emitted;
          ctx.restore();
        }

        function spraySegment(a, b) {
          const cfg = currentCfg();
          if (!cfg || !a || !b) return;
          ensureBrushState(cfg);
          ctx.save();
          resetStrokeState(ctx);
          ctx.fillStyle = "#000";
          const Rbase = Math.max(4, cfg.width?.min || 8);
          const R0 = Rbase * (0.95 + 0.1 * Math.random());
          const dist = Math.max(1e-4, Math.hypot(b.x - a.x, b.y - a.y));
          const steps = Math.max(
            1,
            Math.floor(dist / Math.max(1, cfg.spacingPx || 2)),
          );
          const tx = (b.x - a.x) / dist,
            ty = (b.y - a.y) / dist;
          const nAng = Math.atan2(-tx, ty);
          const sideSign = currentCfg()?._state?.spraySide ?? 1;
          for (let i = 1; i <= steps; i++) {
            if (Math.random() < 0.35) continue;
            const localSide = Math.random() < 0.08 ? -sideSign : sideSign;
            const t = i / steps,
              cx = a.x + tx * dist * t,
              cy = a.y + ty * dist * t;
            const Rstep = R0 * (0.9 + 0.2 * Math.random());
            const sectorOn = Math.random() < 0.25;
            const sectorCenter = sectorOn ? Math.random() * Math.PI * 2 : 0;
            const sectorWidth = sectorOn ? 0.3 + Math.random() * 0.7 : 0;
            const baseDrops = 12;
            const u = Math.random();
            const p = 0.03 + u * u * 0.22;
            for (let k = 0; k < baseDrops; k++) {
              if (Math.random() > p) continue;
              const outerBias = Math.random() < 0.7;
              let rr = outerBias
                ? Rstep * (0.9 + 0.22 * Math.random())
                : Rstep * Math.sqrt(Math.random());
              let th = Math.random() * Math.PI * 2;
              const targetAng = localSide > 0 ? nAng : nAng + Math.PI;
              const d = Math.abs(
                Math.atan2(Math.sin(th - targetAng), Math.cos(th - targetAng)),
              );
              if (d > Math.PI / 2 && Math.random() < 0.75) continue;
              if (sectorOn) {
                const d2 = Math.abs(
                  Math.atan2(
                    Math.sin(th - sectorCenter),
                    Math.cos(th - sectorCenter),
                  ),
                );
                if (d2 < sectorWidth * 0.5) continue;
              }
              const push = (outerBias ? 1.5 : 0.5) * (0.5 + Math.random());
              const x = cx + (rr + push) * Math.cos(th),
                y = cy + (rr + push) * Math.sin(th);
              const r = Math.random();
              const sz = r < 0.12 ? 3 : r < 0.37 ? 1 : 2;
              ctx.fillRect(Math.round(x), Math.round(y), sz, sz);
            }
          }
          ctx.restore();
        }

        function drawSnowSquaresSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg) return;
          ensureBrushState(cfg);
          ctx.save();
          resetStrokeState(ctx);
          const S = (cfg._state = cfg._state || {});
          if (typeof S.snowP !== "number") S.snowP = 0.48;
          const dot = Math.max(2, (cfg.snow && cfg.snow.dot) | 0 || 8);
          const dist = Math.max(1e-4, Math.hypot(b.x - a.x, b.y - a.y));
          const dt = Math.max(1e-4, b.t - a.t);
          const spN = Math.max(0, Math.min(1, dist / dt / 1.6));
          const baseR = 14 + 28 * spN;
          const steps = Math.max(
            1,
            Math.floor(dist / Math.max(1, cfg.spacingPx || 2)),
          );
          const ux = (b.x - a.x) / dist,
            uy = (b.y - a.y) / dist;
          const minGapBase = Math.round(dot * 2.6);
          const key = (ix, iy) => ix + "," + iy;
          const allowed = (x, y, minGap) => {
            const ix = Math.floor(x / minGap),
              iy = Math.floor(y / minGap);
            const min2 = minGap * 0.9 * (minGap * 0.9);
            for (let dx = -1; dx <= 1; dx++) {
              for (let dy = -1; dy <= 1; dy++) {
                const arr = S.occSnow.get(key(ix + dx, iy + dy));
                if (!arr) continue;
                for (let i = 0; i < arr.length; i++) {
                  const p = arr[i];
                  const dx2 = x - p.x,
                    dy2 = y - p.y;
                  if (dx2 * dx2 + dy2 * dy2 < min2) return false;
                }
              }
            }
            return true;
          };
          const record = (x, y, minGap) => {
            const ix = Math.floor(x / minGap),
              iy = Math.floor(y / minGap);
            const k = key(ix, iy);
            const arr = S.occSnow.get(k) || [];
            arr.push({ x, y });
            S.occSnow.set(k, arr);
          };
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const cx = a.x + ux * dist * t,
              cy = a.y + uy * dist * t;
            const e = 1 - Math.abs(1 - 2 * t);
            const edgeW = Math.pow(e, 4.6);
            const keepStep = edgeW > 0.9 || Math.random() < edgeW * 0.12;
            if (!keepStep) continue;
            let nominal =
              (0.2 + 11.0 * edgeW) *
              (0.7 + 0.5 * spN) *
              (0.55 + 1.0 * Math.random());
            if (edgeW < 0.35) nominal *= 0.25;
            if (edgeW > 0.95 && Math.random() < 0.5)
              nominal += 6 + Math.floor(Math.random() * 5);
            let drops = Math.max(1, Math.round(nominal * S.snowP));
            for (let k = 0; k < drops; k++) {
              const R = baseR * (0.85 + 0.55 * Math.random());
              const rr = R * Math.sqrt(Math.random());
              const th = Math.random() * Math.PI * 2;
              const jx = (Math.random() * 2 - 1) * (0.9 + 0.7 * Math.random());
              const jy = (Math.random() * 2 - 1) * (0.9 + 0.7 * Math.random());
              const x = Math.round(cx + rr * Math.cos(th) + jx);
              const y = Math.round(cy + rr * Math.sin(th) + jy);
              const minGap = Math.max(
                2,
                Math.round(
                  minGapBase *
                    (0.7 + 0.4 * Math.random()) *
                    (0.5 + 1.1 * (1 - edgeW)),
                ),
              );
              if (!allowed(x, y, minGap)) continue;
              record(x, y, minGap);
              ctx.strokeStyle = "#000";
              ctx.lineWidth = 1;
              ctx.strokeRect(x + 0.5, y + 0.5, dot - 1, dot - 1);
            }
          }
          ctx.restore();
        }

        function drawDebrisSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg) return;
          ctx.save();
          resetStrokeState(ctx);
          const dens = 0.06,
            nMin = 3,
            nMax = 6,
            eMin = 1,
            eMax = 3,
            selfP = 0.7,
            fillP = 0.45,
            aniso = 0.4,
            sRad = 80;
          const dist = Math.max(1e-4, Math.hypot(b.x - a.x, b.y - a.y));
          const steps = Math.max(
            1,
            Math.floor(dist / Math.max(1, cfg.spacingPx || 2)),
          );
          const ux = (b.x - a.x) / dist,
            uy = (b.y - a.y) / dist;
          for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const cx0 = a.x + ux * dist * t,
              cy0 = a.y + uy * dist * t;
            const rr = (2 + Math.random() * sRad) * Math.sqrt(Math.random());
            const th0 = Math.random() * Math.PI * 2;
            const cx = cx0 + rr * Math.cos(th0),
              cy = cy0 + rr * Math.sin(th0);
            const expected = ((eMax + eMin) / 2) * dens;
            let count = Math.floor(expected);
            if (Math.random() < expected - count) count++;
            for (let k = 0; k < count; k++) {
              const n = Math.floor(Math.random() * (nMax - nMin + 1)) + nMin;
              const edge = eMin + Math.random() * (eMax - eMin);
              const R = edge,
                ax = 1 + aniso * Math.random(),
                ay = 1 + aniso * Math.random();
              const angBase = Math.random() * Math.PI * 2,
                stepAng = (Math.PI * 2) / n;
              const poly = [];
              for (let j = 0; j < n; j++) {
                const th =
                  angBase + j * stepAng + (Math.random() * 2 - 1) * 0.6;
                let rx = R + (Math.random() * 2 - 1) * 1.2;
                if (rx < 0.5) rx = 0.5;
                poly.push({
                  x: Math.round(cx + Math.cos(th) * rx * ax),
                  y: Math.round(cy + Math.sin(th) * rx * ay),
                });
              }
              if (Math.random() < selfP) {
                if (n >= 5 && Math.random() < 0.55) {
                  const kstep = n >= 7 && Math.random() < 0.3 ? 3 : 2;
                  const p = [];
                  for (let r = 0; r < n; r++) {
                    p.push(poly[(r * kstep) % n]);
                  }
                  poly.splice(0, poly.length, ...p);
                } else if (n === 4 && Math.random() < 0.5) {
                  const p = [poly[0], poly[2], poly[1], poly[3]];
                  poly.splice(0, poly.length, ...p);
                } else {
                  const idx = Math.floor(Math.random() * n),
                    v = poly[idx];
                  const vx = v.x - cx,
                    vy = v.y - cy;
                  const mul = 3.0 + Math.random() * 0.6;
                  v.x = Math.round(cx + vx * mul);
                  v.y = Math.round(cy + vy * mul);
                }
              }
              if (Math.random() < fillP) {
                const pth = new Path2D();
                pth.moveTo(poly[0].x, poly[0].y);
                for (let j = 1; j < poly.length; j++) {
                  pth.lineTo(poly[j].x, poly[j].y);
                }
                pth.closePath();
                ctx.fillStyle = "#000";
                try {
                  ctx.fill(pth, "evenodd");
                } catch (e) {
                  ctx.fill(pth);
                }
              } else {
                ctx.save();
                resetStrokeState(ctx);
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#000";
                ctx.beginPath();
                ctx.moveTo(poly[0].x + 0.5, poly[0].y + 0.5);
                for (let j = 1; j < poly.length; j++) {
                  ctx.lineTo(poly[j].x + 0.5, poly[j].y + 0.5);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
              }
            }
          }
          ctx.restore();
        }

        function fillClosedPath(path, fillStyle) {
          const p2 = new Path2D();
          p2.moveTo(path[0].x, path[0].y);
          for (let i = 1; i < path.length; i++) {
            const q = path[i];
            p2.lineTo(q.x, q.y);
          }
          p2.closePath();
          ctx.save();
          resetStrokeState(ctx);
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = fillStyle || "#EAEAEA";
          try {
            ctx.fill(p2, "evenodd");
          } catch (e) {
            ctx.fill(p2);
          }
          ctx.restore();
        }

        function overlayBigDotsRealtimeSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg || !a || !b) return;
          ensureBrushState(cfg);
          const S = cfg._state;
          const s = cfg.bigdots || {};
          const R = Math.max(1, s.radiusPx || 40);
          const base = Math.max(10, s.basePitch || 144);
          const gain = s.speedGain != null ? s.speedGain : 2.0;
          const curv = s.speedCurve != null ? s.speedCurve : 2.4;
          const calib = s.speedCalib != null ? s.speedCalib : 1.6;

          const dist = Math.max(1e-4, Math.hypot(b.x - a.x, b.y - a.y));
          const dt = Math.max(1e-4, b.t - a.t);
          let spN = Math.max(0, Math.min(1, dist / dt / calib));
          spN = Math.pow(spN, curv);
          const ux = (b.x - a.x) / dist,
            uy = (b.y - a.y) / dist;

          if (typeof S.bigDotsDist !== "number") S.bigDotsDist = 0;
          let t = 0;

          ovctx.save();
          resetStrokeState(ovctx);
          while (t <= dist) {
            const edgeBoost = Math.exp(-S.bigDotsDist / 160);
            let pitch = Math.max(36, base * (1 + gain * (0.45 + 0.55 * spN)));
            pitch *=
              (1.3 + 0.5 * Math.random()) *
              (0.6 + 0.4 * (1 - edgeBoost)) *
              (1.6 + 1.2 * (1 - spN));
            const skipP = 0.2 + 0.4 * (1 - edgeBoost);
            const keepPoint = Math.random() > skipP;
            if (keepPoint) {
              const px = Math.round(a.x + ux * t),
                py = Math.round(a.y + uy * t);

              S.bigDotsCenters.push({ x: px, y: py, R });

              ovctx.fillStyle = "#000";
              ovctx.beginPath();
              ovctx.arc(px, py, R, 0, Math.PI * 2);
              ovctx.fill();
              ovctx.globalCompositeOperation = "destination-out";
              ovctx.beginPath();
              ovctx.arc(px, py, Math.max(1, R - 1), 0, Math.PI * 2);
              ovctx.fill();
              ovctx.globalCompositeOperation = "source-over";
            }
            t += pitch;
            S.bigDotsDist += pitch;
          }
          ovctx.restore();
        }

        // Sample speed and pressure every 8px across four samples.
        function drawHatchSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg || !a || !b) return;
          ensureBrushState(cfg);
          const S = cfg._state,
            tick = window.__strokeTick | 0,
            h = cfg.hatch || {};
          if (S.__tick__ !== tick) {
            S.__tick__ = tick;
            S.h_i = 0;
            S.prevOff = 0;
            S.h_sample = 0;
            S.h_elapsed = 0;
            S.h_pressure = 0;
            S.h_window = [];
            S.h_phase = 0;
          }
          const dx = b.x - a.x,
            dy = b.y - a.y,
            dist = Math.hypot(dx, dy);
          if (!(dist > 0)) return;
          const ux = dx / dist,
            uy = dy / dist,
            nx = -uy,
            ny = ux,
            dt = Math.max(1, b.t - a.t);
          const angle = h.angle ?? Math.PI / 4,
            hx = Math.cos(angle),
            hy = Math.sin(angle);
          const Lmin = h.Lmin ?? 6,
            Lmax = h.Lmax ?? 18,
            OFF = h.offsetN ?? 6;
          const snap = (v) => Math.round(v) + 0.5;
          function jhash(n) {
            n = (n << 13) ^ n;
            return (
              1 -
              ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) /
                1073741824
            );
          }
          const r01 = (i) => (jhash((tick * 911 + i * 31337) | 0) + 1) * 0.5;
          ctx.save();
          resetStrokeState(ctx);
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#000";
          ctx.lineCap = "butt";
          let position = 0;

          while (position < dist) {
            const step = Math.min(8 - S.h_sample, dist - position);
            if (!(step > 0)) break;
            const duration = (dt * step) / dist;
            const pressure = a.p + ((b.p - a.p) * (position + step / 2)) / dist;
            S.h_sample += step;
            S.h_elapsed += duration;
            S.h_pressure += pressure * duration;
            position += step;
            if (S.h_sample < 8) continue;
            S.h_window.push({
              time: S.h_elapsed,
              pressure: S.h_pressure / S.h_elapsed,
            });
            if (S.h_window.length > 4) S.h_window.shift();
            const speed =
              (8 * S.h_window.length * 1000) /
              S.h_window.reduce((sum, q) => sum + q.time, 0);
            const p =
              S.h_window.reduce((sum, q) => sum + q.pressure, 0) /
              S.h_window.length;
            const speedStep = [128, 256, 512].filter((v) => speed > v).length;
            const pressureStep = clamp(Math.ceil(p * 4), 1, 4) - 2;
            const pitch = clamp(
              8 * 2 ** clamp(speedStep - pressureStep, 0, 3),
              h.Pmin ?? 8,
              h.Pmax ?? 64,
            );
            S.h_sample = 0;
            S.h_elapsed = 0;
            S.h_pressure = 0;
            S.h_phase += 8 / pitch;
            if (S.h_phase < 1) continue;
            S.h_phase -= 1;
            S.h_i++;

            const ph = (S.h_i * 0.318) % 1,
              len = Lmin + (Lmax - Lmin) * (0.35 + 0.45 * ph);
            const u = r01(S.h_i),
              sign = r01(S.h_i + 9999) < 0.5 ? -1 : 1;
            let tri = (u < 0.5 ? 2 * u : 2 * (1 - u)) * sign;
            if (S.h_i % 5 === 0) tri *= 0.3;
            const off = S.prevOff * 0.35 + tri * OFF * 0.65;
            S.prevOff = off;
            const mx = a.x + ux * position + nx * off,
              my = a.y + uy * position + ny * off;
            ctx.beginPath();
            ctx.moveTo(snap(mx - (hx * len) / 2), snap(my - (hy * len) / 2));
            ctx.lineTo(snap(mx + (hx * len) / 2), snap(my + (hy * len) / 2));
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawCrossScatterSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg || !a || !b) return;
          ensureBrushState(cfg);
          const S = (cfg._state = cfg._state || {});

          const __tick = window.__strokeTick | 0;
          if (S.__g20Tick !== __tick) {
            S.__g20Tick = __tick;
            S.crossOcc = new Map();
            S.phase = Math.random();
            S.densPhase = Math.random() * Math.PI * 2;
          }
          if (!(S.crossOcc instanceof Map)) S.crossOcc = new Map();

          const c = cfg.cross || {};
          const size = Math.max(2, c.size | 0 || 8);
          const half = size / 2;
          const minGap = Math.max(4, c.minGap | 0 || Math.round(size * 1.5));
          const spacing = Math.max(1, cfg.spacingPx || minGap);
          const spread = Math.max(c.spread | 0 || 48, Math.floor(size * 4));

          const dx = b.x - a.x,
            dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          if (!(dist > 0)) return;
          const steps = Math.max(1, Math.floor(dist / spacing));
          const ux = dx / steps,
            uy = dy / steps;

          const occ = S.crossOcc;
          const key = (x, y) =>
            Math.floor(x / minGap) + "," + Math.floor(y / minGap);
          const allowed = (x, y) => !occ.has(key(x, y));
          const record = (x, y) => occ.set(key(x, y), 1);

          ctx.save();
          resetStrokeState(ctx);
          ctx.lineWidth = Math.max(1, (cfg.width && cfg.width.min) || 1);
          ctx.strokeStyle = "#000";

          for (let i = 0; i <= steps; i++) {
            const t = (i + (S.phase || 0)) / steps;

            const dens =
              0.35 +
              0.65 *
                (0.5 +
                  0.5 * Math.sin(t * 2 * Math.PI * 0.9 + (S.densPhase || 0)));
            if (Math.random() > dens) continue;

            const x = a.x + ux * i + (Math.random() - 0.5) * spread;
            const y = a.y + uy * i + (Math.random() - 0.5) * spread;
            if (!allowed(x, y)) continue;
            record(x, y);

            const dxh = half;
            ctx.beginPath();
            ctx.moveTo(x - dxh, y);
            ctx.lineTo(x + dxh, y);
            ctx.moveTo(x, y - dxh);
            ctx.lineTo(x, y + dxh);
            ctx.stroke();
          }
          ctx.restore();
        }

        function drawRandomSegment(a, b) {
          const cfg = currentCfg();
          if (!cfg || !a || !b) return;
          ensureBrushState(cfg);
          const S = (cfg._state = cfg._state || {});
          const __tick = window.__strokeTick | 0;
          if (S.__tick__ !== __tick) {
            S.__tick__ = __tick;
            S.rsResid = 0;
            S.rsIndex = 0;
          }
          const g = cfg.rseg || {};
          const basePitch = Math.max(12, g.pitch | 0 || 40);
          const lenScale = Math.max(1.0, g.lenScale || 3.6);
          const Lbase = basePitch * lenScale;
          const fmin = Math.max(0.25, Math.min(1.0, g.fracMin || 0.5));
          const fmax = Math.max(fmin, Math.min(1.0, g.fracMax || 0.6667));
          const stepMul = Math.max(0.15, Math.min(0.8, g.stepMul || 0.35));
          const stepLen = Math.max(6, Lbase * stepMul);

          function snap(v) {
            return Math.round(v) + 0.5;
          }
          function rand01() {
            return Math.random();
          }

          const dx = b.x - a.x,
            dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          if (!(dist > 0)) return;
          const ux = dx / dist,
            uy = dy / dist;

          let remain = dist,
            tLocal = 0,
            resid = S.rsResid > 0 ? S.rsResid : stepLen;

          ctx.save();
          resetStrokeState(ctx);
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#000";
          ctx.lineCap = "butt";
          ctx.lineJoin = "miter";
          ctx.miterLimit = 2;
          while (remain >= resid) {
            tLocal += resid;
            S.rsIndex++;
            const cx = a.x + ux * tLocal,
              cy = a.y + uy * tLocal;

          const p = inputPoint(e),
            dx = lastInputPoint ? p.x - lastInputPoint.x : 0,
            dy = lastInputPoint ? p.y - lastInputPoint.y : 0,
            cfg = currentCfg(),
            thin = cfg && cfg.width && cfg.width.min <= 2;
          if (
            thin &&
            currentSeat().charAt(0) !== "E" &&
            dx * dx + dy * dy < 1.5625
          )
            return;
          if (!strokeSnapshotPushed) strokeSnapshotPushed = pushSnapshot();
          pts.push(p);
          lastInputPoint = p;
          if (!__rafPending) {
            __rafPending = true;
            requestAnimationFrame(__flushDraw);
          }
        }
        function endStroke(e, cancelled) {
          if (
            activePointerId === null ||
            (e && e.pointerId != null && e.pointerId !== activePointerId)
          )
            return;
          if (cancelled) {
            __rafPending = false;
            drawing = false;
            pts = [];
            clearOverlay();
            if (strokeSnapshotPushed) restoreSnapshot();
          } else {
            if (e && drawing) {
              const p = inputPoint(e),
                prev = pts[pts.length - 1];
              if (!prev || Math.hypot(p.x - prev.x, p.y - prev.y) > 0.01) {
                if (!strokeSnapshotPushed)
                  strokeSnapshotPushed = pushSnapshot();
                pts.push(p);
              }
            }
            __flushDraw();
            finish();
          }
          try {
            if (cvs.hasPointerCapture(activePointerId))
              cvs.releasePointerCapture(activePointerId);
          } catch (_) {}
          activePointerId = null;
          strokeSnapshotPushed = false;
          lastInputPoint = null;
        }
        cvs.addEventListener("pointerdown", beginStroke, { passive: false });
        cvs.addEventListener("pointermove", moveStroke, { passive: false });
        cvs.addEventListener("pointerup", (e) => endStroke(e, false));
        cvs.addEventListener("pointercancel", (e) => endStroke(e, true));
        cvs.addEventListener("lostpointercapture", (e) => {
          if (drawing) endStroke(e, true);
        });
        addEventListener("blur", () => {
          if (drawing) endStroke(null, true);
        });

        (function () {
          const eraserBtn = document.getElementById("eraserBtn");
          const backBtn = document.getElementById("backBtn");
          const clearBtn = document.getElementById("clearBtn");
          const saveLink = document.getElementById("saveLink");
          if (eraserBtn)
            eraserBtn.addEventListener("click", function () {
              setEraserActive(!__eraserActive);
            });
          if (backBtn)
            backBtn.addEventListener("click", function () {
              restoreSnapshot();
            });
          if (clearBtn)
            clearBtn.addEventListener("click", function () {
              pushSnapshot();
              fillWhite();
            });
          if (saveLink)
            saveLink.addEventListener("click", () => {
              try {
                const out = document.createElement("canvas");
                out.width = cvs.width;
                out.height = cvs.height;
                const g = out.getContext("2d");
                g.setTransform(1, 0, 0, 1, 0, 0);
                g.fillStyle = "#fff";
                g.fillRect(0, 0, out.width, out.height);
                g.drawImage(cvs, 0, 0);
                out.toBlob((blob) => {
                  if (!blob)
                    return console.error("PNG save failed: empty Blob");
                  const now = new Date(),
                    ts =
                      now.getFullYear() +
                      String(now.getMonth() + 1).padStart(2, "0") +
                      String(now.getDate()).padStart(2, "0") +
                      "_" +
                      String(now.getHours()).padStart(2, "0") +
                      String(now.getMinutes()).padStart(2, "0") +
                      String(now.getSeconds()).padStart(2, "0"),
                    url = URL.createObjectURL(blob),
                    a = document.createElement("a");
                  a.download = "doodle-line_" + ts + ".png";
                  a.href = url;
                  document.body.appendChild(a);
                  a.click();
                  a.remove();
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                }, "image/png");
              } catch (e) {
                console.error("PNG save failed:", e);
              }
            });
          updateBackEnabled();
        })();

        buildThumbs();
      });
    </script>

    <script id="tagline-controller">
      (function () {
        "use strict";
        function onReady(fn) {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", fn, { once: true });
          } else {
            fn();
          }
        }
        function randInt(min, max) {
          return Math.floor(min + Math.random() * (max - min + 1));
        }
        function updateTaglineSizes() {
          var tg = document.getElementById("tagline");
          if (!tg) return;
          var spans = tg.querySelectorAll("span");
          var i,
            n = Math.min(7, spans.length);
          for (i = 0; i < n; i++) {
            var cls = "t" + (i + 1);
            if (!spans[i].classList.contains(cls)) spans[i].classList.add(cls);
          }
          var root = document.documentElement;
          for (i = 1; i <= n; i++) {
            var px = randInt(12, 16);
            root.style.setProperty("--tg" + i, px + "px");
          }
        }
        onReady(function () {
          updateTaglineSizes();
          var c = document.getElementById("c");
          if (c) {
            c.addEventListener(
              "pointerup",
              function () {
                updateTaglineSizes();
              },
              false,
            );
            c.addEventListener(
              "mouseup",
              function () {
                updateTaglineSizes();
              },
              false,
            );
            c.addEventListener(
              "touchend",
              function () {
                updateTaglineSizes();
              },
              false,
            );
          }
          var grid = document.getElementById("thumbgrid");
          if (grid) {
            grid.addEventListener(
              "click",
              function (e) {
                var t = e.target,
                  hit = false;
                if (t && t.classList && t.classList.contains("thumb"))
                  hit = true;
                else if (t && t.closest && t.closest(".thumb")) hit = true;
                if (hit) updateTaglineSizes();
              },
              false,
            );
          }
          var eb = document.getElementById("eraserBtn");
          if (eb) {
            eb.addEventListener(
              "click",
              function () {
                setTimeout(function () {
                  updateTaglineSizes();
                }, 0);
              },
              false,
            );
          }
          var cb = document.getElementById("clearBtn");
          if (cb) {
            cb.addEventListener(
              "click",
              function () {
                updateTaglineSizes();
              },
              false,
            );
          }
          var sb = document.getElementById("saveLink");
          if (sb) {
            sb.addEventListener(
              "click",
              function () {
                updateTaglineSizes();
              },
              false,
            );
          }
        });
      })();
    </script>
  </body>
