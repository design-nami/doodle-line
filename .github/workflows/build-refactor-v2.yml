name: Build Doodle Line V2 prototype

on:
  push:
    branches:
      - refactor-v2-prototype
    paths:
      - scripts/build-refactor-v2.payload.*
      - .github/workflows/build-refactor-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: refactor-v2-prototype
          fetch-depth: 0

      - name: Preserve source for local verification
        uses: actions/upload-artifact@v4
        with:
          name: doodle-line-source
          path: index.html
          retention-days: 1

      - name: Reconstruct build script
        run: |
          cat scripts/build-refactor-v2.payload.* | base64 --decode | gzip --decompress > /tmp/build-refactor-v2.mjs
          node --check /tmp/build-refactor-v2.mjs

      - name: Build and verify prototype
        run: node /tmp/build-refactor-v2.mjs

      - name: Restore clean offline registration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'index-v2.html';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes('doodle-line-v2-offline-registration')) {
            const registration = `
          <script id="doodle-line-v2-offline-registration">
          (() => {
            'use strict';
            if (!('serviceWorker' in navigator)) return;
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
            addEventListener('load', () => {
              navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                .then(() => navigator.serviceWorker.ready)
                .then(() => console.info('[DoodleLine V2] Offline cache ready.'))
                .catch(error => console.warn('[DoodleLine V2] Offline cache setup failed:', error));
            }, { once: true });
          })();
          <\/script>
          `;
            html = html.replace('</body>', `${registration}\n</body>`);
            fs.writeFileSync(path, html, 'utf8');
          }
          NODE

      - name: Verify generated structure
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index-v2.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `generated-script-${index + 1}.js` }));
          const required = ['H27', 'setPointerCapture', 'UNDO_MAX_BYTES', 'toBlob', 'doodle-line-v2-offline-registration'];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Missing generated token: ${token}`);
          }
          console.log(`Verified ${scripts.length} generated script blocks.`);
          NODE

      - name: Upload generated prototype
        uses: actions/upload-artifact@v4
        with:
          name: doodle-line-v2-prototype
          path: |
            index-v2.html
            REFACTOR_REPORT.md
          retention-days: 7

      - name: Commit generated prototype
        run: |
          if [ -z "$(git status --porcelain -- index-v2.html REFACTOR_REPORT.md)" ]; then
            echo "Prototype is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html REFACTOR_REPORT.md
          git commit -m "Build refactored V2 prototype"
          git push origin HEAD:refactor-v2-prototype
