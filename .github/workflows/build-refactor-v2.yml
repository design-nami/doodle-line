name: Build Doodle Line V2 prototype

on:
  push:
    branches:
      - refactor-v2-prototype
    paths:
      - scripts/build-refactor-v2.mjs
      - scripts/build-refactor-v2.payload.*
      - .github/workflows/build-refactor-v2.yml
  workflow_dispatch:

concurrency:
  group: doodle-line-v2-prototype-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: refactor-v2-prototype
          fetch-depth: 0

      - name: Verify build loader
        run: node --check scripts/build-refactor-v2.mjs

      - name: Build and verify prototype
        run: node scripts/build-refactor-v2.mjs

      - name: Verify generated structure
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index-v2.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `generated-script-${index + 1}.js` }));
          const checks = [
            ['26th brush seat', /"H26"/],
            ['no orphan 27th seat', /"H27"/, false],
            ['two-column grid', /grid-template-columns:\s*repeat\(2/],
            ['pointer capture', /setPointerCapture/],
            ['memory-bounded Undo', /UNDO_MAX_BYTES/],
            ['Blob export', /toBlob/],
            ['candidate brush renderer', /drawV2CandidateSegment/]
          ];
          for (const [label, pattern, expected = true] of checks) {
            if (pattern.test(html) !== expected) throw new Error(`Generated feature check failed: ${label}`);
          }
          const forbidden = [
            'EventTarget.prototype.addEventListener',
            'resize-preserve-251105n',
            'rootfix-seat-brush-mode-251105n',
            'save-move-under-G-251105q',
            'doodle-line-offline-registration',
            'navigator.serviceWorker.register'
          ];
          for (const token of forbidden) {
            if (html.includes(token)) throw new Error(`Obsolete or unsafe token remains: ${token}`);
          }
          console.log(`Verified ${scripts.length} generated script blocks and the 26-brush layout.`);
          NODE

      - name: Upload complete test package
        uses: actions/upload-artifact@v4
        with:
          name: doodle-line-v2-prototype
          path: |
            index-v2.html
            REFACTOR_REPORT.md
            manifest.json
            icon-180.png
            icon-192.png
            icon-512.png
          retention-days: 14

      - name: Commit generated prototype
        run: |
          if [ -z "$(git status --porcelain -- index-v2.html REFACTOR_REPORT.md)" ]; then
            echo "Prototype is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html REFACTOR_REPORT.md
          git commit -m "Build refactored five-brush V2 prototype"
          git fetch origin refactor-v2-prototype
          git rebase origin/refactor-v2-prototype
          git push origin HEAD:refactor-v2-prototype
