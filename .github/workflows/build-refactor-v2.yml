name: Build Doodle Line V2 prototype

on:
  push:
    branches:
      - refactor-v2-prototype
    paths:
      - scripts/build-refactor-v2.mjs
      - .github/workflows/build-refactor-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: refactor-v2-prototype
          fetch-depth: 0

      - name: Verify build script
        run: node --check scripts/build-refactor-v2.mjs

      - name: Build prototype
        run: node scripts/build-refactor-v2.mjs

      - name: Isolate prototype from the production offline cache
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'index-v2.html';
          let html = fs.readFileSync(path, 'utf8');
          const before = html;
          html = html.replace(/<script id=["']doodle-line-offline-registration["']>[\s\S]*?<\/script>\s*/g, '');
          if (html === before) throw new Error('Production service-worker registration was not found in the generated file.');
          fs.writeFileSync(path, html, 'utf8');
          NODE

      - name: Verify generated structure
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index-v2.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: `generated-script-${index + 1}.js` }));
          const required = [
            'H27',
            'grid-template-columns:repeat(2',
            'setPointerCapture',
            'UNDO_MAX_BYTES',
            'toBlob',
            'drawV2CandidateSegment'
          ];
          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Missing generated token: ${token}`);
          }
          const forbidden = [
            'EventTarget.prototype.addEventListener',
            'resize-preserve-251105n',
            'rootfix-seat-brush-mode-251105n',
            'save-move-under-G-251105q',
            'doodle-line-offline-registration',
            'doodle-line-v2-offline-registration'
          ];
          for (const token of forbidden) {
            if (html.includes(token)) throw new Error(`Obsolete or unsafe token remains: ${token}`);
          }
          console.log(`Verified ${scripts.length} generated script blocks.`);
          NODE

      - name: Upload complete test package
        uses: actions/upload-artifact@v4
        with:
          name: doodle-line-v2-prototype
          path: |
            index-v2.html
            REFACTOR_REPORT.md
            manifest.json
            icon-180.png
            icon-192.png
            icon-512.png
          retention-days: 14

      - name: Commit generated prototype
        run: |
          if [ -z "$(git status --porcelain -- index-v2.html REFACTOR_REPORT.md)" ]; then
            echo "Prototype is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v2.html REFACTOR_REPORT.md
          git commit -m "Build refactored V2 prototype"
          git push origin HEAD:refactor-v2-prototype
